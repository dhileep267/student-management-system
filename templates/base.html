{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">StudentMS</a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">
            <span class="text-white">Hi, {{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'student_list' %}">Students</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-danger btn-sm" type="submit">Logout</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container py-4">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
